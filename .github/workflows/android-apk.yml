name: Build Demir INFO Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - 'index.html'
      - 'youtube.html'
      - 'impressum.html'
      - 'datenschutz.html'
      - '.github/workflows/android-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle current Demir INFO website offline
        run: |
          mkdir -p android-app/app/src/main/assets
          cp index.html youtube.html impressum.html datenschutz.html android-app/app/src/main/assets/
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Demir-INFO-Android-debug-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
