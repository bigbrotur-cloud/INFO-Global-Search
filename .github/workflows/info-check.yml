name: INFO Website Check (150 Durchlaeufe)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: 150 Website-Pruefungen hintereinander
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.error, time, re
          from datetime import datetime, timezone
          url = "https://bigbrotur-cloud.github.io/INFO-Global-Search/"
          local = pathlib.Path("index.html").read_text(encoding="utf-8")
          required = ["INFO", "Deutschland", "Europa", "Global", "YouTube", "az-letters", "az-settings", "cookie-consent", "impressum", "datenschutz"]
          results = []
          for i in range(1, 151):
              errors = [f"Fehlender Inhalt: {item}" for item in required if item.lower() not in local.lower()]
              status = None
              try:
                  req = urllib.request.Request(url + "?test_run=" + str(i), headers={"User-Agent": "Demir-INFO-150-Check/1.0", "Cache-Control": "no-cache"})
                  with urllib.request.urlopen(req, timeout=12) as response:
                      status = response.status
                      page = response.read().decode("utf-8", "replace")
                  if status != 200: errors.append(f"HTTP {status}")
                  for key in ["INFO", "az-letters", "az-settings", "cookie-consent"]:
                      if key.lower() not in page.lower():
                          errors.append(f"Live-Seite ohne {key}")
              except Exception as exc:
                  errors.append(f"Live-Fehler: {exc}")
              results.append({"durchlauf": i, "status": status, "erfolgreich": not errors, "fehler": errors})
              print(f"Durchlauf {i:03d}/150: " + ("OK" if not errors else "FEHLER: " + "; ".join(errors)), flush=True)
              time.sleep(0.1)
          failures = [r for r in results if not r["erfolgreich"]]
          report = {"zeit_utc": datetime.now(timezone.utc).isoformat(), "ziel": url, "durchlaeufe": len(results), "bestanden": len(results)-len(failures), "fehlgeschlagen": len(failures), "ergebnisse": results}
          pathlib.Path("info-150-test-report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"ERGEBNIS: {report['bestanden']}/150 erfolgreich", flush=True)
          if failures: raise SystemExit(1)
          PY

      - name: Testbericht speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: info-150-testbericht
          path: info-150-test-report.json
          retention-days: 30
