<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff791b">
<meta name="description" content="INFO Global Search – dein Kompass fürs Internet. Produkte bei Shops in Deutschland, Europa oder weltweit suchen.">
<title>Demir INFO – Dein Kompass fürs Internet</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#172941;background:#f5f8fc;font-synthesis:none}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column}
header{text-align:center;padding:38px 18px 12px}
.logo{display:inline-flex;align-items:center;gap:10px;font-size:clamp(38px,8vw,62px);letter-spacing:-3px;font-weight:900;color:#ff791b;line-height:1}
.logo-i{font-family:Georgia,serif;font-style:italic;display:inline-block;animation:rotate-i 12s ease-in-out infinite;transform-origin:50% 50%}
@keyframes rotate-i{0%,15%,85%,100%{transform:rotateY(0)}50%{transform:rotateY(360deg)}}
@media(prefers-reduced-motion:reduce){.logo-i{animation:none}}
main{width:min(100%,960px);margin:0 auto;padding:16px 20px 55px;text-align:center;flex:1}
h1{font-size:clamp(25px,5vw,36px);margin:20px 0 8px}p{color:#5b6d83} .subtitle{margin:0 0 30px}
.search{background:#fff;border:1px solid #dbe3ec;border-radius:20px;box-shadow:0 8px 28px #dbe3ed;padding:15px;display:grid;grid-template-columns:minmax(0,1fr) 165px auto;gap:10px;align-items:center}
input,select{font:inherit;border:1px solid #d7e0e9;border-radius:11px;background:white;padding:15px;min-width:0;width:100%;color:#172941}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #ffb775;outline-offset:3px}
button{font:inherit;font-weight:750;color:#fff;background:#ed690c;border:0;border-radius:11px;padding:16px 22px;cursor:pointer}
button:hover{background:#cb5705}
.note{font-size:13px;text-align:left;margin:14px 4px 0;color:#617088}
#status{margin-top:30px;text-align:left;font-weight:700;min-height:22px}
#results{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;text-align:left}
.shop{display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;background:white;color:#18344d;border:1px solid #dde5ee;border-radius:15px;padding:20px;min-height:125px;box-shadow:0 4px 16px #e5eaf0;transition:transform .15s,border-color .15s}
.shop:hover{border-color:#ff791b;transform:translateY(-2px)}.shop strong{font-size:17px}.shop span{font-size:13px;color:#62748a;margin-top:12px}
footer{padding:22px 12px;text-align:center;border-top:1px solid #dfe6ee;color:#62748a;font-size:13px}footer a{color:#984400}
@media(max-width:650px){.search{grid-template-columns:1fr}.search button{width:100%}header{padding-top:28px}main{padding:12px 15px 38px}}
</style>
</head>
<body>
<header><div class="logo" aria-label="Demir INFO"><span class="logo-i" aria-hidden="true">i</span><span>INFO</span></div></header>
<main>
<h1>Dein Kompass fürs Internet</h1>
<p class="subtitle">Weniger suchen, mehr finden.</p>
<form id="form" class="search" role="search">
<label for="query" class="sr-only" style="position:absolute;left:-9999px">Suchbegriff</label>
<input id="query" name="q" type="search" placeholder="Was suchst du? Zum Beispiel Katzenfutter" maxlength="200" autocomplete="off" required>
<label for="scope" class="sr-only" style="position:absolute;left:-9999px">Suchregion</label>
<select id="scope" name="region">
<option value="de">Deutschland</option><option value="eu">Europa</option><option value="global">Weltweit</option>
</select>
<button type="submit">Jetzt suchen</button>
</form>
<p class="note">INFO zeigt dir direkte Suchlinks zu Anbietern. Preise und Verfügbarkeit prüfst du auf deren Webseiten.</p>
<div id="status" role="status" aria-live="polite"></div>
<div id="results"></div>
</main>
<footer>Demir INFO · Bit to Qubit · <a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a></footer>
<script>
"use strict";
const shops={
de:[["Google Shopping","https://www.google.com/search?tbm=shop&q="],["Amazon Deutschland","https://www.amazon.de/s?k="],["eBay Deutschland","https://www.ebay.de/sch/i.html?_nkw="],["Idealo","https://www.idealo.de/preisvergleich/MainSearchProductCategory.html?q="],["Kaufland","https://www.kaufland.de/s/?search_value="],["OTTO","https://www.otto.de/suche/"]],
eu:[["Google Shopping","https://www.google.com/search?tbm=shop&q="],["Amazon Deutschland","https://www.amazon.de/s?k="],["Amazon Frankreich","https://www.amazon.fr/s?k="],["Amazon Italien","https://www.amazon.it/s?k="],["Amazon Spanien","https://www.amazon.es/s?k="],["eBay Deutschland","https://www.ebay.de/sch/i.html?_nkw="],["eBay UK","https://www.ebay.co.uk/sch/i.html?_nkw="]],
global:[["Google Shopping","https://www.google.com/search?tbm=shop&q="],["Amazon USA","https://www.amazon.com/s?k="],["eBay weltweit","https://www.ebay.com/sch/i.html?_nkw="],["AliExpress","https://www.aliexpress.com/w/wholesale-"],["Walmart","https://www.walmart.com/search?q="],["Etsy","https://www.etsy.com/search?q="],["Amazon Japan","https://www.amazon.co.jp/s?k="]]
};
const form=document.getElementById("form"),query=document.getElementById("query"),scope=document.getElementById("scope"),results=document.getElementById("results"),status=document.getElementById("status");
function search(){
const term=query.value.trim();results.replaceChildren();
if(!term){status.textContent="Bitte gib einen Suchbegriff ein.";return;}
const encoded=encodeURIComponent(term),list=shops[scope.value]||shops.de;
status.textContent=list.length+" Anbieter für „"+term+"“";
for(const [name,url] of list){
const a=document.createElement("a");a.className="shop";a.href=url+encoded;a.target="_blank";a.rel="noopener noreferrer";
const title=document.createElement("strong");title.textContent=name+" ↗";
const detail=document.createElement("span");detail.textContent="Suchergebnisse beim Anbieter öffnen";
a.append(title,detail);results.append(a);
}
}
form.addEventListener("submit",event=>{event.preventDefault();search();});
const params=new URLSearchParams(location.search),initial=params.get("q"),region=params.get("region");
if(region&&shops[region])scope.value=region;
if(initial){query.value=initial.slice(0,200);search();}
</script>
</body>
</html>
